<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d14" />
    <meta name="description" content="3D-часы, которые разбираются при прокрутке, конструктор часов и анимации на React, three.js и framer-motion." />

    <!-- Превью ссылки в Telegram, WhatsApp, VK, Facebook и др. (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pulse" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://esersultan.github.io/animated-site/" />
    <meta property="og:title" content="Pulse — 3D-часы, которые разбираются при прокрутке" />
    <meta property="og:description" content="Соберите свои часы в конструкторе и загляните внутрь механизма. Анимации на React, three.js и framer-motion." />
    <meta property="og:image" content="https://esersultan.github.io/animated-site/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://esersultan.github.io/animated-site/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Золотые 3D-часы с синим циферблатом и надпись «3D-часы, которые разбираются при прокрутке»" />

    <!-- Превью в X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pulse — 3D-часы, которые разбираются при прокрутке" />
    <meta name="twitter:description" content="Конструктор часов и анимации на React, three.js и framer-motion." />
    <meta name="twitter:image" content="https://esersultan.github.io/animated-site/og-image.jpg" />
    <script>
      // Ставим тему до отрисовки, чтобы не было вспышки
      try {
        var m = localStorage.getItem('mode')
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.mode = m
      } catch (e) {}
    </script>
    <title>Pulse — 3D-часы, которые разбираются при прокрутке</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
